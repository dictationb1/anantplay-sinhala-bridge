# AnantPlay Sinhala Subtitle Bridge v4 — Cloudflare Worker (free tier)
# One unified worker: the Bridge UI, real /sub/<token>.srt delivery, the v3 Companion
# API AND the v4 MULTI-PROVIDER zero-429 translation engine.
#
# ── v4 TRANSLATION CHAIN (automatic failover, ONE legitimate key each) ────────
#   TRANSLATION_CHAIN (var, optional) — default order:
#     azure → google_v3 → gemini → workers_ai
#   npx wrangler secret put AZURE_TRANSLATOR_KEY     # Azure AI Translator F0: 2,000,000 chars/MONTH free (Sinhala ✓ NMT)
#   npx wrangler secret put AZURE_TRANSLATOR_REGION  # optional (default global), e.g. eastus
#   npx wrangler secret put GOOGLE_V3_KEY            # Google Cloud Translation: 500,000 chars/month free (Sinhala ✓)
#   npx wrangler secret put GEMINI_API_KEY           # Gemini free tier ≈1,500 RPD shared (LLM quality)
#   [ai] binding below (uncomment)                   # Workers AI: 10,000 neurons/day, ZERO external key
#   Any 429 trips a 10-minute per-provider circuit breaker and the batch continues
#   on the next provider. Unconfigured providers are skipped automatically.
#
#   Multi-account key farming is NOT used and NOT recommended: rotating Google
#   accounts to multiply free-tier Gemini keys violates Google's ToS and risks
#   account/key suspension. One legitimate key per provider + failover + the
#   permanent KV cache is the sustainable architecture.
#
# ── KV (STRONGLY recommended — free forever) ──────────────────────────────────
#   100,000 reads/day + 1,000 writes/day free. Without it jobs are per-isolate:
#   they vanish on isolate restarts ("token cold / isolate miss") and the worker
#   reports status:"degraded" + a loud storageWarn in /health and /api/status.
#   npx wrangler kv namespace create SUBS_KV     # prints an id → paste it below
#   npx wrangler deploy
#
# v3 secrets kept: GEMINI_API_KEY, SUBDL_API_KEY (optional human-subs provider).
# v4 lab: node lab/verify_worker_v4_e2e.mjs  (real workerd + local KV + mock providers)

name = "anantplay-si-subs-bridge"
main = "worker/src/index.js"
compatibility_date = "2024-10-01"

# Static Bridge UI, served by Cloudflare's asset layer on the same origin as the API.
# Only non-asset paths (/index.json, /sites.json, /deeplinks.json, /api/*, /sub/*, /subtitles/*) reach the Worker.
[assets]
directory = "./bridge-ui/public"
binding = "ASSETS"

# KV store (STRONGLY recommended: permanent translation cache + resumable job store).
# This id belongs to the production namespace (anantplay-si-subs-bridge.techworldlk.workers.dev).
# Deploying to ANOTHER account? Replace it with your own:
#   npx wrangler kv namespace create SUBS_KV     # prints id = "…" → paste above
# To deploy with ZERO configuration (no KV at all), comment this block out: the worker
# still boots and serves, reporting status:"degraded" + storageWarn:SUBS_KV instead of crashing.
# CI's `wrangler deploy --dry-run` stays green either way.
[[kv_namespaces]]
binding = "SUBS_KV"
id = "bced026adaee4ddaa641a033a2ddb552"

# Optional: extra subtitle hosts /api/fetch-sub may download from (the built-in allowlist is
# opensubtitles.org, opensubtitles.com, subdl.com, subdl.org, piratelk.com).
# [vars]
# ALLOWED_SUB_HOSTS = "mysubtitles.example,mirror.example"


# ── v4.1 MULTI-LANGUAGE + TRANSLATE-PA (Layer 1, optional) ────────────────────
# Any registry language: GET /subtitles/movie/tt….json?lang=si|ta|hi|en|es|fr|ja|ko|zh-CN|ar|ur|de|ru|pt|th|id|tr|vi
#                        &register=auto|spoken|formal  (auto = genre-decided; Epic/History → formal)
# Two-stage delivery: the base NMT .srt is playable immediately (X-Sub-Quality: base-nmt);
# the cinema polish upgrades the SAME token in the background (X-Polish-Status: pending→done).
#
# translate-pa — Chrome's keyless translation endpoint, live-verified 2026-11-22
# (natural SPOKEN Sinhala, 500-line batches, <i> tags preserved). UNDOCUMENTED:
# it can be walled any day — the chain (azure → google_v3 → gemini → workers_ai)
# takes over automatically via the circuit breaker. OFF by default.
#   [vars]
#   ENABLE_TRANSLATE_PA = "true"          ← uncomment this line (and the [vars] header) to enable
# And EITHER one secret (wrangler secret put TRANSLATE_PA_KEY) or modular vars
# (TRANSLATE_PA_KEY_HEAD / TRANSLATE_PA_KEY_TAIL) — NEVER commit a key literal.
# TRANSLATE_PA_KEY_HEAD = "AIza…"   ← first half (var)
# TRANSLATE_PA_KEY_TAIL = "…520"    ← second half (var)
#   (vars, not secrets, keep GitHub secret-scanning quiet about the full pattern;
#    the assembled key is only ever present in worker memory)

# Optional: override the Gemini model (default: gemini-flash-latest) — a Worker var, not a secret.
# GEMINI_MODEL = "gemini-flash-latest"
# Test/lab only: point the pipeline at a local mock Gemini (loopback is allowed, nothing else
# non-https). Never set this in production.
# GEMINI_API_BASE = "http://127.0.0.1:8788"
